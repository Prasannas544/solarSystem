name: Next.js CI Checks (Yarn)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'  # Caches yarn dependencies
          
      - name: Install Yarn
        run: npm install -g yarn
      
      - name: Install dependencies
        run: yarn install --frozen-lockfile  # Strictly uses lockfile
      
      - name: Build Project
        run: yarn build
      
